$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
stack: "backend"
tags: ["kubernetes", "indexer", "nats", "surrealdb"]

dependsOn:
  - "database"
  - "nats"

tasks:
  build:
    command: "tsdown"
    args: ["--config", "tsdown.config.ts"]
    deps:
      - "^:build"
    inputs:
      - "@group(sources)"
    outputs:
      - "dist"
    options:
      cache: true
      mergeArgs: "replace"
      mergeDeps: "replace"

  dev:
    command: "node"
    args: ["dist/index.mjs"]
    deps:
      - "zeko-indexer:build"
      - "^:build"
    options:
      persistent: true

  start:
    command: "node"
    args: ["dist/index.mjs"]
