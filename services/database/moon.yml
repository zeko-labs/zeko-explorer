$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "library"
stack: "backend"
tags: ["surrealdb", "database"]

dependsOn:
  - "domain"

fileGroups:
  tests:
    - "tests/**/*.feature"
    - "tests/**/*.ts"
    - "queries/**/*.surql"
    - "surrealkit/**/*.surql"
    - "surrealkit/**/*.toml"
    - "moon.yml"
    - "package.json"
    - "tsconfig.json"
    - "/docs/spikes/008-surrealdb-schema/surrealkit/**/*.surql"
    - "/docs/spikes/008-surrealdb-schema/surrealkit/**/*.toml"
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"

tasks:
  test:
    command: "vitest"
    args: ["run", "--passWithNoTests", "--testTimeout=60000", "--hookTimeout=60000"]
    inputs:
      - "@group(tests)"
    options:
      cache: false
      mergeArgs: "replace"
      mergeInputs: "replace"

  migrate-local:
    command: "nu"
    args: ["scripts/migrate-local.nu"]
    options:
      cache: false
      runInCI: false
