$schema: "../../.moon/cache/schemas/project.json"
language: "typescript"
layer: "library"
stack: "backend"
tags: ["surrealdb", "database"]

dependsOn:
  - "domain"

tasks:
  migrate-local:
    command: "nu"
    args: ["services/database/scripts/migrate-local.nu"]
    inputs:
      - "moon.yml"
      - "scripts/**/*"
      - "surrealkit/**/*"
      - "package.json"
      - "/.prototools"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
