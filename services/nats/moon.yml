$schema: "../../.moon/cache/schemas/project.json"
language: "typescript"
layer: "library"
stack: "backend"
tags: ["nats", "protocol", "messaging"]

dependsOn:
  - "domain"

tasks:
  setup-local:
    command: "nu"
    args: ["services/nats/scripts/setup-local.nu"]
    inputs:
      - "moon.yml"
      - "scripts/**/*"
      - "src/**/*"
      - "package.json"
      - "/.prototools"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
