$schema: "../../.moon/cache/schemas/project.json"
language: "typescript"
layer: "application"
stack: "backend"
tags: ["cloudflare", "graphql", "gateway"]

dependsOn:
  - "domain"

tasks:
  dev:
    command: "wrangler"
    args: ["dev", "--local", "--port", "8787"]
    options:
      persistent: true

  types:
    command: "wrangler"
    args: ["types", "--config", "wrangler.jsonc"]
    inputs:
      - "moon.yml"
      - "wrangler.jsonc"
      - "package.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    outputs:
      - "worker-configuration.d.ts"
