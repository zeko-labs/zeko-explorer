$schema: "../.moon/cache/schemas/project.json"
language: "javascript"
layer: "automation"
stack: "infrastructure"
tags: ["acceptance", "cucumber"]

tasks:
  acceptance:
    command: "cucumber-js"
    args:
      - "tests/acceptance/**/*.feature"
      - "--import"
      - "tests/acceptance/steps/*.mjs"
      - "--format"
      - "progress"
    inputs:
      - "acceptance/**/*"
      - "/infra/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      runFromWorkspaceRoot: true
