name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      checks: write
      statuses: write
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install Nu
        run: proto install nu

      - name: Install Actionlint
        run: proto install actionlint

      - run: moon run root:actionlint

      - run: moon ci --summary normal

      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          matrix: '{"ci":"ci"}'
          access-token: ${{ secrets.GITHUB_TOKEN }}
