name: Images

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan images
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
    outputs:
      has-images: ${{ steps.images.outputs.has-images }}
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - id: images
        shell: bash
        run: |
          set -euo pipefail

          cat > image-projects.json <<'JSON'
          [
            { "id": "l1-watcher", "image": "l1-watcher", "project": "services/l1-watcher" },
            { "id": "zeko-indexer", "image": "zeko-indexer", "project": "services/zeko-indexer" },
            { "id": "explorer-api", "image": "explorer-api", "project": "services/explorer-api" },
            { "id": "bridge-api", "image": "bridge-api", "project": "services/bridge-api" }
          ]
          JSON

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            moon query projects --affected --downstream deep > affected-projects.json
          else
            printf '{"projects":[]}\n' > affected-projects.json
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const imageProjects = JSON.parse(fs.readFileSync("image-projects.json", "utf8"));
          const eventName = process.env.GITHUB_EVENT_NAME;
          let include = imageProjects;

          if (eventName === "pull_request") {
            const affected = JSON.parse(fs.readFileSync("affected-projects.json", "utf8"));
            const affectedIds = new Set(affected.projects.map((project) => project.id));
            include = imageProjects.filter((project) => affectedIds.has(project.id));
          }

          const matrix = {
            include:
              include.length > 0
                ? include.map(({ id, image, project }) => ({ id, image, project, shouldBuild: true }))
                : [{ id: "none", image: "no affected images", project: "", shouldBuild: false }],
          };

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has-images=${include.length > 0}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE

  images:
    name: Build Image - ${{ matrix.image }}
    needs: plan
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: No affected image projects
        if: ${{ !matrix.shouldBuild }}
        run: echo "No image projects were affected by this pull request."

      - uses: actions/checkout@v4
        if: ${{ matrix.shouldBuild }}
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        if: ${{ matrix.shouldBuild }}
        with:
          auto-install: true

      - name: Scaffold Docker context
        if: ${{ matrix.shouldBuild }}
        run: moon docker scaffold ${{ matrix.id }}

      - uses: docker/setup-buildx-action@v3
        if: ${{ matrix.shouldBuild }}

      - uses: docker/login-action@v3
        if: ${{ matrix.shouldBuild && github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: ${{ matrix.shouldBuild }}
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=${{ github.sha }},enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=tag,enable=${{ github.event_name != 'pull_request' }}

      - id: build
        if: ${{ matrix.shouldBuild }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.project }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
