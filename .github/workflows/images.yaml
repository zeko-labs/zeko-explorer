name: Images

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: l1-watcher
            project: services/l1-watcher
          - image: zeko-indexer
            project: services/zeko-indexer
          - image: explorer-api
            project: services/explorer-api
          - image: bridge-api
            project: services/bridge-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - uses: docker/setup-buildx-action@v3

      - id: auth
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ github.event_name == 'pull_request' && format('zeko/{0}', matrix.image) || format('gcr.io/{0}/{1}', vars.GCP_PROJECT_ID, matrix.image) }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=${{ github.sha }},enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=tag,enable=${{ github.event_name != 'pull_request' }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.project }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
