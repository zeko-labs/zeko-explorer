name: Images

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: warp-ubuntu-latest-x64-8x
    strategy:
      fail-fast: false
      matrix:
        image:
          - l1-watcher
          - zeko-indexer
          - explorer-api
          - bridge-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - uses: docker/setup-buildx-action@v3

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCR auth
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push image
        env:
          IMAGE: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ matrix.image }}
        run: |
          docker build \
            --file "infra/docker/${{ matrix.image }}.Dockerfile" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          fi
