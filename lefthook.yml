pre-commit:
  parallel: true
  commands:
    lint-fix:
      run: proto run moon -- run :lint-fix
      stage_fixed: true
    format-fix:
      run: proto run moon -- run :format-fix
      stage_fixed: true
    actionlint:
      run: proto run moon -- run root:actionlint
    typecheck:
      run: proto run moon -- run :typecheck
