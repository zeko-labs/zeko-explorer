$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
stack: "backend"
tags: ["kubernetes", "indexer", "nats", "surrealdb"]

dependsOn:
  - "db"
  - "domain"
  - "nats-protocol"

tasks:
  dev:
    command: "pnpm"
    args: ["run", "dev"]
    options:
      persistent: true
