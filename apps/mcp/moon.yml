$schema: "../../.moon/cache/schemas/project.json"
language: "typescript"
layer: "application"
stack: "backend"
tags: ["cloudflare", "mcp"]

dependsOn:
  - "domain"

tasks:
  dev:
    command: "wrangler"
    args: ["dev", "--local", "--port", "8789"]
    options:
      persistent: true

  types:
    command: "wrangler"
    args: ["types", "--config", "wrangler.jsonc"]
    inputs:
      - "wrangler.jsonc"
    outputs:
      - "worker-configuration.d.ts"
