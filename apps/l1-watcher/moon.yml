$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
stack: "backend"
tags: ["kubernetes", "watcher", "nats"]

dependsOn:
  - "domain"
  - "nats-protocol"

tasks:
  dev:
    command: "node"
    args: ["--experimental-strip-types", "--experimental-specifier-resolution=node", "src/index.ts"]
    options:
      persistent: true
