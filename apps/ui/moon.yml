$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["nuxt", "cloudflare"]

toolchains:
  typescript:
    # Nuxt owns this project's tsconfig references through `nuxt prepare`.
    syncProjectReferences: false
    syncProjectReferencesToPaths: false
    includeProjectReferenceSources: false
    pruneProjectReferences: false
    routeOutDirToCache: false

fileGroups:
  sources:
    - "app/**/*"
    - "moon.yml"
    - "nuxt.config.ts"
    - "package.json"
    - "tsconfig.json"
    - "/tsconfig.base.json"
  workspaceDeps:
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
  tests:
    - "tests/**/*"
    - "app/**/*.test.ts"
    - "app/**/*.spec.ts"

workspace:
  inheritedTasks:
    exclude: ["build", "typecheck"]

tasks:
  build:
    command: "nuxt"
    args: ["build"]
    deps:
      - "ui:prepare"
    inputs:
      - "@group(sources)"
      - "@group(workspaceDeps)"
    outputs:
      - ".output"

  dev:
    command: "nuxt"
    args: ["dev", "--host", "0.0.0.0"]
    options:
      persistent: true

  prepare:
    command: "nuxt"
    args: ["prepare"]
    inputs:
      - "@group(sources)"
      - "@group(workspaceDeps)"
    outputs:
      - ".nuxt/tsconfig.json"
      - ".nuxt/tsconfig.app.json"
      - ".nuxt/tsconfig.server.json"
      - ".nuxt/tsconfig.shared.json"
      - ".nuxt/tsconfig.node.json"

  typecheck:
    command: "tsgo"
    args: ["--project", "tsconfig.json", "--noEmit"]
    deps:
      - "ui:prepare"
    inputs:
      - "@group(sources)"
      - "@group(workspaceDeps)"
