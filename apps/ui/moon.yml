$schema: "../../.moon/cache/schemas/project.json"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["nuxt", "cloudflare"]

fileGroups:
  sources:
    - "app/**/*"
    - "moon.yml"
    - "nuxt.config.ts"
    - "package.json"
    - "tsconfig.json"
    - "/tsconfig.base.json"
  workspaceDeps:
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
  tests:
    - "tests/**/*"
    - "app/**/*.test.ts"
    - "app/**/*.spec.ts"

workspace:
  inheritedTasks:
    exclude: ["build", "typecheck"]

tasks:
  build:
    command: "nuxt"
    args: ["build"]
    inputs:
      - "@group(sources)"
      - "@group(workspaceDeps)"
    outputs:
      - ".output"

  dev:
    command: "nuxt"
    args: ["dev", "--host", "0.0.0.0"]
    options:
      persistent: true

  typecheck:
    script: "nuxt prepare && tsgo --project tsconfig.json --noEmit"
    inputs:
      - "@group(sources)"
      - "@group(workspaceDeps)"
