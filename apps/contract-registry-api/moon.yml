$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
stack: "backend"
tags: ["cloudflare", "contract-registry"]

dependsOn:
  - "contract-schema"

tasks:
  dev:
    command: "../../node_modules/.bin/wrangler"
    args: ["dev", "--local", "--port", "8788"]
    options:
      persistent: true

  types:
    command: "../../node_modules/.bin/wrangler"
    args: ["types", "--config", "wrangler.jsonc"]
    inputs:
      - "wrangler.jsonc"
    outputs:
      - "worker-configuration.d.ts"
