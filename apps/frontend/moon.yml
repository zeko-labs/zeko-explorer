$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["nuxt", "cloudflare"]

workspace:
  inheritedTasks:
    exclude: ["build", "lint", "test", "typecheck"]

tasks:
  build:
    command: "pnpm"
    args: ["run", "build"]
    inputs:
      - "app.vue"
      - "nuxt.config.ts"
      - "package.json"
    outputs:
      - ".output"

  dev:
    command: "pnpm"
    args: ["run", "dev"]
    options:
      persistent: true

  typecheck:
    command: "pnpm"
    args: ["run", "typecheck"]
    inputs:
      - "app.vue"
      - "nuxt.config.ts"
      - "package.json"
