$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["nuxt", "cloudflare"]

workspace:
  inheritedTasks:
    exclude: ["build", "typecheck"]

tasks:
  build:
    command: "node_modules/.bin/nuxt"
    args: ["build"]
    inputs:
      - "app/**/*"
      - "nuxt.config.ts"
      - "package.json"
    outputs:
      - ".output"

  dev:
    command: "node_modules/.bin/nuxt"
    args: ["dev", "--host", "0.0.0.0"]
    options:
      persistent: true

  typecheck:
    command: "node_modules/.bin/nuxt"
    args: ["typecheck"]
    inputs:
      - "app/**/*"
      - "nuxt.config.ts"
      - "package.json"
