$schema: "../.moon/cache/schemas/project.json"
language: "unknown"
layer: "automation"
stack: "infrastructure"
tags: ["infra", "kubernetes", "docker"]

fileGroups:
  workspaceDeps:
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
  k8s:
    - "moon.yml"
    - "k8s/**/*"
    - "scripts/k8s-tools/**/*"
    - "/.prototools"
  acceptance:
    - "moon.yml"
    - "cucumber.yaml"
    - "tests/**/*"
    - "tsconfig.json"
    - "k8s/**/*"
    - "local/docker-desktop/**/*"
  testTypes:
    - "moon.yml"
    - "tests/**/*.ts"
    - "tsconfig.json"
    - "/tsconfig.base.json"

tasks:
  install-k8s-tools:
    command: "nu"
    args: ["scripts/k8s-tools/install.nu"]
    inputs:
      - "scripts/k8s-tools/install.nu"
      - "/.prototools"
    outputs:
      - "/.moon/cache/tools/bin/helm"
      - "/.moon/cache/tools/bin/kubeconform"
      - "/.moon/cache/tools/bin/yamlfmt"
    options:
      runInCI: true

  build-local-images:
    command: "nu"
    args: ["local/docker-desktop/build-local-images.nu"]
    options:
      cache: false
      runInCI: false

  dev:
    command: "nu"
    args: ["local/docker-desktop/dev.nu"]
    options:
      cache: false
      persistent: true
      runInCI: false

  k8s-local-down:
    command: "nu"
    args: ["local/docker-desktop/down.nu"]
    options:
      cache: false
      runInCI: false

  k8s-local-forward:
    command: "nu"
    args: ["local/docker-desktop/forward.nu"]
    options:
      cache: false
      persistent: true
      runInCI: false

  k8s-local-up:
    command: "nu"
    args: ["local/docker-desktop/up.nu"]
    deps:
      - "infra:build-local-images"
    options:
      cache: false
      runInCI: false

  acceptance:
    command: "cucumber-js"
    toolchains: ["javascript"]
    args:
      - "--config"
      - "cucumber.yaml"
    inputs:
      - "@group(acceptance)"
      - "@group(workspaceDeps)"

  lint:
    command: "nu"
    args: ["scripts/k8s-tools/validate.nu"]
    deps:
      - "infra:install-k8s-tools"
    inputs:
      - "@group(k8s)"

  typecheck:
    command: "tsgo"
    toolchains: ["javascript"]
    args:
      - "--project"
      - "tsconfig.json"
      - "--noEmit"
    inputs:
      - "@group(testTypes)"
      - "@group(workspaceDeps)"
