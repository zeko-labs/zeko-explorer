$schema: "../.moon/cache/schemas/project.json"
language: "bash"
layer: "automation"
stack: "infrastructure"
tags: ["infra", "kubernetes", "docker"]

tasks:
  install-k8s-tools:
    command: "./scripts/k8s-tools/install.sh"
    inputs:
      - "scripts/k8s-tools/install.sh"
      - "/.prototools"
    options:
      cache: false

  build-local-images:
    command: "./local/docker-desktop/build-local-images.sh"
    inputs:
      - "docker/**/*"
      - "/apps/*/src/**/*"
      - "/services/*/src/**/*"
      - "/packages/*/src/**/*"
      - "/.moon/**/*"
      - "/.prototools"
      - "/package.json"
      - "/pnpm-workspace.yaml"
    options:
      runInCI: false

  dev:
    command: "./local/docker-desktop/dev.sh"
    options:
      persistent: true
      runInCI: false

  k8s-local-down:
    command: "./local/docker-desktop/down.sh"
    options:
      runInCI: false

  k8s-local-forward:
    command: "./local/docker-desktop/forward.sh"
    options:
      persistent: true
      runInCI: false

  k8s-local-up:
    command: "./local/docker-desktop/up.sh"
    deps:
      - "infra:build-local-images"
    inputs:
      - "k8s/**/*"
      - "local/docker-desktop/**/*"
    options:
      runInCI: false

  lint:
    command: "./scripts/k8s-tools/validate.sh"
    deps:
      - "infra:install-k8s-tools"
    inputs:
      - "k8s/**/*"
      - "scripts/k8s-tools/**/*"
      - "/tools/validate-yaml.mjs"
      - "/.prototools"
