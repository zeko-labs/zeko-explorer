$schema: "../.moon/cache/schemas/project.json"
language: "unknown"
layer: "automation"
stack: "infrastructure"
tags: ["infra", "kubernetes", "docker"]

tasks:
  install-k8s-tools:
    command: "nu"
    args: ["infra/scripts/k8s-tools/install.nu"]
    inputs:
      - "scripts/k8s-tools/install.nu"
      - "/.prototools"
    options:
      cache: false
      runFromWorkspaceRoot: true

  build-local-images:
    command: "nu"
    args: ["infra/local/docker-desktop/build-local-images.nu"]
    inputs:
      - "/apps/*/src/**/*"
      - "/services/*/src/**/*"
      - "/services/*/Dockerfile"
      - "/packages/*/src/**/*"
      - "/.moon/**/*"
      - "/.prototools"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  dev:
    command: "nu"
    args: ["infra/local/docker-desktop/dev.nu"]
    options:
      persistent: true
      runFromWorkspaceRoot: true
      runInCI: false

  k8s-local-down:
    command: "nu"
    args: ["infra/local/docker-desktop/down.nu"]
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  k8s-local-forward:
    command: "nu"
    args: ["infra/local/docker-desktop/forward.nu"]
    options:
      persistent: true
      runFromWorkspaceRoot: true
      runInCI: false

  k8s-local-up:
    command: "nu"
    args: ["infra/local/docker-desktop/up.nu"]
    deps:
      - "infra:build-local-images"
    inputs:
      - "k8s/**/*"
      - "local/docker-desktop/**/*"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  lint:
    command: "nu"
    args: ["infra/scripts/k8s-tools/validate.nu"]
    deps:
      - "infra:install-k8s-tools"
    inputs:
      - "k8s/**/*"
      - "scripts/k8s-tools/**/*"
      - "/.prototools"
    options:
      runFromWorkspaceRoot: true
