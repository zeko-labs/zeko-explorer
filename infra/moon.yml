$schema: "../.moon/cache/schemas/project.json"
language: "unknown"
layer: "automation"
stack: "infrastructure"
tags: ["infra", "kubernetes", "docker"]

tasks:
  install-k8s-tools:
    command: "nu"
    args: ["infra/scripts/k8s-tools/install.nu"]
    inputs:
      - "moon.yml"
      - "scripts/k8s-tools/install.nu"
      - "/.prototools"
    options:
      cache: false
      runFromWorkspaceRoot: true

  build-local-images:
    command: "nu"
    args: ["infra/local/docker-desktop/build-local-images.nu"]
    inputs:
      - "/apps/*/app/**/*"
      - "/apps/*/moon.yml"
      - "/apps/*/package.json"
      - "/apps/*/tsconfig.json"
      - "/apps/*/src/**/*"
      - "/services/*/moon.yml"
      - "/services/*/package.json"
      - "/services/*/src/**/*"
      - "/services/*/tsconfig.json"
      - "/services/*/tsdown.config.ts"
      - "/services/*/Dockerfile"
      - "/packages/*/moon.yml"
      - "/packages/*/package.json"
      - "/packages/*/src/**/*"
      - "/packages/*/tsconfig.json"
      - "/.moon/**/*"
      - "/.prototools"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
      - "/tsconfig.base.json"
    options:
      runFromWorkspaceRoot: true
      runInCI: false

  dev:
    command: "nu"
    args: ["infra/local/docker-desktop/dev.nu"]
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
      runInCI: false

  k8s-local-down:
    command: "nu"
    args: ["infra/local/docker-desktop/down.nu"]
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  k8s-local-forward:
    command: "nu"
    args: ["infra/local/docker-desktop/forward.nu"]
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
      runInCI: false

  k8s-local-up:
    command: "nu"
    args: ["infra/local/docker-desktop/up.nu"]
    deps:
      - "infra:build-local-images"
    inputs:
      - "moon.yml"
      - "k8s/**/*"
      - "local/docker-desktop/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false

  acceptance:
    command: "cucumber-js"
    toolchains: ["javascript"]
    args:
      - "--config"
      - "infra/cucumber.yaml"
    inputs:
      - "moon.yml"
      - "cucumber.yaml"
      - "tests/**/*"
      - "tsconfig.json"
      - "k8s/**/*"
      - "local/docker-desktop/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
    options:
      runFromWorkspaceRoot: true

  lint:
    command: "nu"
    args: ["infra/scripts/k8s-tools/validate.nu"]
    deps:
      - "infra:install-k8s-tools"
    inputs:
      - "moon.yml"
      - "k8s/**/*"
      - "scripts/k8s-tools/**/*"
      - "/.prototools"
    options:
      runFromWorkspaceRoot: true

  typecheck:
    command: "tsgo"
    toolchains: ["javascript"]
    args:
      - "--project"
      - "infra/tsconfig.json"
      - "--noEmit"
    inputs:
      - "moon.yml"
      - "tests/**/*.ts"
      - "tsconfig.json"
      - "/tsconfig.base.json"
    options:
      runFromWorkspaceRoot: true
