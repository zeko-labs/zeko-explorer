networkId: zeko-m-local

storage:
  className: hostpath
  natsSize: 1Gi
  surrealdbSize: 1Gi

nats:
  maxAge: 168h

workloads:
  l1Watcher:
    enabled: false
  zekoIndexer:
    enabled: true
  explorerApi:
    enabled: true
  bridgeApi:
    enabled: true
  backfillService:
    enabled: false

resources:
  nats:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  surrealdb:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  app:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
