  <h1>Single-Host zeko-m-alphanet Topology</h1>
  <p>One Talos node runs the full zeko-m-alphanet explorer stack. Hive Gateway runs on Cloudflare Workers and reaches private Explorer/Bridge services through Cloudflare Tunnel.</p>

          .line{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#fb7185;stroke-width:1.4;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}
        </style>
