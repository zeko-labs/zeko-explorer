$schema: "../.moon/cache/schemas/project.json"
language: "unknown"
layer: "configuration"
stack: "unknown"
tags: ["docs"]

fileGroups:
  scripts:
    - "moon.yml"
    - "tsconfig.json"
    - "scripts/**/*.ts"
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
    - "/tsconfig.base.json"
  prdSource:
    - glob: "PRD.html"
    - "scripts/sync-prd.ts"
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
  prdCheck:
    - glob: "PRD.html"
    - "PRD.md"
    - "scripts/sync-prd.ts"
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"

tasks:
  sync-prd:
    command: "node"
    args: ["scripts/sync-prd.ts"]
    inputs:
      - "@group(prdSource)"
    outputs:
      - "PRD.md"
    options:
      runInCI: false

  check-prd:
    command: "node"
    args: ["scripts/sync-prd.ts", "--check"]
    inputs:
      - "@group(prdCheck)"

  typecheck:
    command: "tsgo"
    toolchains: ["javascript"]
    args: ["--project", "docs/tsconfig.json", "--noEmit"]
    inputs:
      - "@group(scripts)"
    options:
      runFromWorkspaceRoot: true
