inheritedBy:
  language: "typescript"

fileGroups:
  sources:
    - "src/**/*"
    - "package.json"
    - "tsconfig.json"
    - "/tsconfig.base.json"
  tests:
    - "tests/**/*"
    - "src/**/*.test.ts"
    - "src/**/*.spec.ts"

tasks:
  build:
    command: "../../node_modules/.bin/tsc"
    args: ["--project", "tsconfig.json"]
    inputs:
      - "@group(sources)"
    outputs:
      - "dist"

  lint:
    command: "../../node_modules/.bin/biome"
    args: ["check", "."]
    inputs:
      - "@group(sources)"

  format:
    command: "../../node_modules/.bin/biome"
    args: ["check", "--write", "."]
    inputs:
      - "@group(sources)"

  test:
    command: "../../node_modules/.bin/vitest"
    args: ["run", "--passWithNoTests"]
    inputs:
      - "@group(sources)"
      - "@group(tests)"

  typecheck:
    command: "../../node_modules/.bin/tsc"
    args: ["--project", "tsconfig.json", "--noEmit"]
    inputs:
      - "@group(sources)"
