$schema: "../cache/schemas/tasks.json"

inheritedBy:
  language: "typescript"

fileGroups:
  sources:
    - "src/**/*"
    - "package.json"
    - "tsdown.config.*"
    - "tsconfig.json"
    - "/tsconfig.base.json"
  tests:
    - "tests/**/*"
    - "src/**/*.test.ts"
    - "src/**/*.spec.ts"

tasks:
  build:
    command: "tsgo"
    args: ["--project", "tsconfig.json"]
    inputs:
      - "@group(sources)"

  lint:
    command: "biome"
    args: ["lint", "."]
    inputs:
      - "@group(sources)"

  format:
    command: "biome"
    args: ["format", "."]
    inputs:
      - "@group(sources)"

  lint-fix:
    command: "biome"
    args: ["lint", "--write", "."]
    inputs:
      - "@group(sources)"
    options:
      runInCI: false

  format-fix:
    command: "biome"
    args: ["format", "--write", "."]
    inputs:
      - "@group(sources)"
    options:
      runInCI: false

  test:
    command: "vitest"
    args: ["run", "--passWithNoTests"]
    inputs:
      - "@group(sources)"
      - "@group(tests)"

  typecheck:
    command: "tsgo"
    args: ["--project", "tsconfig.json", "--noEmit"]
    inputs:
      - "@group(sources)"
